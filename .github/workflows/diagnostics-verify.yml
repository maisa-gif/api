name: TEMP - run diagnostic route

# Temporary, manual-only workflow to call a route and read its full
# response (status + body) without curl's -f flag hiding error bodies.
# Delete this file once it's no longer needed.
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Route path to call, e.g. /api/cron/sync-transcripts"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://api-ochre-ten-68.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ROUTE_PATH: ${{ inputs.path }}
    steps:
      - name: Call route (no -f, show status + body)
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL$ROUTE_PATH"
