name: TEMP - verify transcript sync

# Temporary, manual-only workflow to read back the diagnostic route's
# output via the job log (no other way to see the response body without
# knowing CRON_SECRET locally). Delete this file once verification is
# done — same pattern as the diagnostic routes it calls.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://api-ochre-ten-68.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call verify-transcript-sync diagnostic route
        run: |
          curl -sf -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/diagnostics/verify-transcript-sync" | python3 -m json.tool
